[tools]
prek = "latest"
vhs = "latest"

[tasks."demo:build"]
run = "cargo build --release"
description = "Build vig for demo recording"
hide = true

[tasks.demo]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo.tape"
depends = ["demo:build"]
description = "Record demo GIF"

[tasks."demo:yank"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-yank.tape"
depends = ["demo:build"]
description = "Record yank demo GIF"

[tasks."demo:branch"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-branch.tape"
depends = ["demo:build"]
description = "Record branch selector demo GIF"

[tasks."demo:search"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-search.tape"
depends = ["demo:build"]
description = "Record search demo GIF"

[tasks."demo:reflog"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-reflog.tape"
depends = ["demo:build"]
description = "Record reflog demo GIF"

[tasks."demo:github-issue"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-github-issue.tape"
depends = ["demo:build"]
description = "Record GitHub Issue demo GIF"

[tasks."demo:github-pr"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-github-pr.tape"
depends = ["demo:build"]
description = "Record GitHub PR demo GIF"

[tasks."demo:commit-log"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-commit-log.tape"
depends = ["demo:build"]
description = "Record commit log demo GIF"

[tasks."demo:config"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-config.tape"
depends = ["demo:build"]
description = "Record user config demo GIF"

[tasks."demo:files"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-files.tape"
depends = ["demo:build"]
description = "Record Files view demo GIF"

[tasks."demo:docker"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-docker.tape"
depends = ["demo:build"]
description = "Record Docker view demo GIF (requires a running Docker daemon)"

[tasks."demo:procs"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-procs.tape"
depends = ["demo:build"]
description = "Record Procs view demo GIF"

[tasks."demo:worktrees"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-worktrees.tape"
depends = ["demo:build"]
description = "Record Worktrees view demo GIF"

[tasks."demo:projects"]
run = "PATH=$PWD/target/release:$PATH vhs tape/demo-projects.tape"
depends = ["demo:build"]
description = "Record Projects view demo GIF (requires gh with the project scope)"

[tasks."demo:all"]
depends = ["demo", "demo:yank", "demo:branch", "demo:search", "demo:reflog", "demo:github-issue", "demo:github-pr", "demo:commit-log", "demo:config", "demo:files", "demo:docker", "demo:procs", "demo:worktrees", "demo:projects"]
description = "Record all demo GIFs"
