name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "assets/*.gif"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build books
        run: |
          mdbook build docs/guide --dest-dir "$GITHUB_WORKSPACE/site"
          mdbook build docs/guide/ja --dest-dir "$GITHUB_WORKSPACE/site/ja"

      - name: Copy demo GIFs into the site
        run: |
          mkdir -p site/assets site/ja/assets
          cp assets/*.gif site/assets/
          cp assets/*.gif site/ja/assets/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
