[package]
name = "vig"
version = "0.6.0"
edition = "2021"
description = "Git TUI side-by-side diff viewer"
authors = ["td72"]
license = "MIT"
repository = "https://github.com/td72/vig"
homepage = "https://github.com/td72/vig"
readme = "README.md"
keywords = ["git", "tui", "diff", "viewer", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/*.gif", "tape/", ".github/", "docs/"]

[dependencies]
anyhow = "1"
crossterm = "0.28"
git2 = "0.20"
notify = "7"
notify-debouncer-mini = "0.5"
ratatui = "0.30"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
arboard = "3"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
clap = { version = "4", features = ["derive"] }
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "compression-flate2", "rustls", "signatures"] }
kdl = "6.7.1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }

[features]
vendored = ["git2/vendored-libgit2", "git2/vendored-openssl"]

[profile.release]
strip = true
lto = "thin"
